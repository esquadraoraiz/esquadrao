<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Página não encontrada · Esquadrão Raiz</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f3a24">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=Figtree:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* 404 no tema Noite do Framework visual (B19, D3) */
:root{--fundo:#08140e;--superficie:#12241a;--linha:#2e4b3a;--tinta:#eaf1e6;--tinta-suave:#a3b8a8;--gramado:#0f3a24;--gramado-faixa:#13442b;
  --cal:#f3f7f0;--amarelo-cartao:#f5c430;--amarelo-tinta:#2a2105;--papel-tinta:#1b1a14;--foco:#f5c430;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;color:var(--tinta);font:400 16px/24px Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--gramado);background-image:repeating-linear-gradient(90deg,var(--gramado) 0 48px,var(--gramado-faixa) 48px 96px)}
main{width:min(440px,100%);background:var(--superficie);border:2px solid var(--papel-tinta);border-radius:16px;box-shadow:0 6px 0 var(--papel-tinta);padding:28px 22px;text-align:center;display:grid;gap:14px;justify-items:center}
.rotulo{margin:0;font:500 11px/14px "JetBrains Mono",ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta-suave)}
h1{margin:0;font:900 44px/.95 "Big Shoulders Display","Arial Narrow",Impact,sans-serif;text-transform:uppercase;letter-spacing:.01em}
h1 em{font-style:normal;color:var(--amarelo-cartao)}
p{margin:0;color:var(--tinta-suave)}
a.jogar{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:14px 22px;border-radius:6px;border:2px solid var(--papel-tinta);box-shadow:0 4px 0 var(--papel-tinta);
  background:var(--amarelo-cartao);color:var(--amarelo-tinta);text-decoration:none;font:900 18px/1 "Big Shoulders Display","Arial Narrow",Impact,sans-serif;letter-spacing:.06em;text-transform:uppercase}
a.jogar:active{transform:translateY(3px);box-shadow:0 1px 0 var(--papel-tinta)}
a:focus-visible{outline:3px solid var(--foco);outline-offset:2px}
</style>
</head>
<body>
<main>
  <p class="rotulo">Erro 404</p>
  <h1>Bola <em>fora</em></h1>
  <p>Essa página não existe. O jogo está no campo principal.</p>
  <a class="jogar" href="/">Jogar o Esquadrão Raiz</a>
</main>
</body>
</html>
